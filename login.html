<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - SKO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-10">
                <div class="card border-0 shadow-lg overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-6 bg-sko-primary text-white p-5 d-flex flex-column justify-content-center" style="background: linear-gradient(135deg, #003399, #0055cc);">
                            <img src="images/logo.png" alt="SKO" class="mb-4" style="height: 60px; width: max-content;">
                            <h2 class="fw-bold mb-3">শিক্ষক, জনশিক্ষা ও শিক্ষা প্রশাসনের ঐক্যবদ্ধ প্ল্যাটফর্ম</h2>
                            <p class="mb-0 opacity-75">সদস্য সেবা, সংগঠন ব্যবস্থাপনা, অনলাইন আবেদন ও প্রশাসনিক কার্যক্রম—সব এক প্ল্যাটফর্মে।</p>
                        </div>
                        <div class="col-md-6 bg-white p-5">
                            <h3 class="fw-bold text-center text-sko-primary mb-4">সদস্য ও কর্মকর্তা লগইন</h3>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">সদস্য আইডি / মোবাইল নম্বর</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">পাসওয়ার্ড</label>
                                    <input type="password" class="form-control" required>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">আমাকে মনে রাখুন</label></div>
                                    <a href="#" class="text-decoration-none small">পাসওয়ার্ড ভুলে গেছেন?</a>
                                </div>
                                <button type="submit" class="btn btn-sko-green w-100 py-2 mb-3">লগইন করুন</button>
                                <p class="text-center text-muted small mb-0">নতুন সদস্য? <a href="registration.html" class="text-decoration-none fw-bold">নিবন্ধন করুন</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script><script src="js/main.js"></script>
</body>
</html>
