<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সদস্য যাচাই - SKO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header/Navbar -->
    <header class="page-header reveal">
        <div class="container">
            <h1 class="display-6 fw-bold mb-2">সদস্য যাচাই (Member Verification)</h1>
            <p class="lead mb-0">SKO এবং এর সহযোগী সংগঠনের নিবন্ধিত সদস্যদের তথ্য যাচাই করুন</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="row g-4">
            <div class="col-lg-5 reveal">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">সদস্য যাচাই করুন</h5>
                        <ul class="nav nav-tabs mb-3" id="verifyTabs" role="tablist">
                            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#byId">সদস্য নম্বর</button></li>
                            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#byNid">NID নম্বর</button></li>
                            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#byQr">QR কোড</button></li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="byId">
                                <label class="form-label fw-semibold">সদস্য নম্বর <span class="text-danger">*</span></label>
                                <input type="text" class="form-control mb-3" placeholder="যেমন: SKO-BCTA-254001">
                                <button class="btn btn-sko-green w-100"><i data-lucide="search" class="me-1" style="width:16px;"></i> যাচাই করুন</button>
                            </div>
                            <div class="tab-pane fade" id="byNid">
                                <label class="form-label fw-semibold">NID নম্বর <span class="text-danger">*</span></label>
                                <input type="text" class="form-control mb-3" placeholder="১৭ সংখ্যার NID">
                                <button class="btn btn-sko-green w-100">যাচাই করুন</button>
                            </div>
                            <div class="tab-pane fade text-center" id="byQr">
                                <div class="border rounded p-4 mb-3 bg-light">
                                    <i data-lucide="qr-code" style="width: 80px; height: 80px;" class="text-muted"></i>
                                    <p class="text-muted small mt-2">QR কোড স্ক্যান করুন</p>
                                </div>
                                <button class="btn btn-outline-primary w-100">ছবি আপলোড করুন</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-7 reveal">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4 text-center d-flex flex-column justify-content-center">
                        <i data-lucide="shield-check" class="text-success mb-3 mx-auto" style="width: 60px; height: 60px;"></i>
                        <h4 class="fw-bold">সদস্য যাচাইয়ের ফলাফল</h4>
                        <p class="text-muted">সদস্য নম্বর বা QR কোড প্রদান করে যাচাই করুন। সঠিক তথ্য প্রদান করা হলে এখানে সদস্যের বিস্তারিত তথ্য দেখা যাবে।</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script><script src="js/main.js"></script>
</body>
</html>
