<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সদস্য সেবাসমূহ - SKO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header/Navbar -->
    <header class="page-header reveal">
        <div class="container">
            <h1 class="display-6 fw-bold mb-2">সদস্য সেবাসমূহ (Member Services)</h1>
            <p class="lead mb-0">SKO-এর নিবন্ধিত সদস্যদের জন্য অনলাইন সেবাসমূহ</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-3 reveal">
                <a href="#" class="quick-link-card p-3 text-center">
                    <i data-lucide="user-plus" class="text-primary mb-2" style="width:32px;height:32px;"></i>
                    <h6 class="fw-bold mb-1">সদস্য নিবন্ধন</h6>
                    <small class="text-muted">নতুন সদস্য হিসেবে নিবন্ধন</small>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-3 reveal">
                <a href="#" class="quick-link-card p-3 text-center">
                    <i data-lucide="refresh-cw" class="text-success mb-2" style="width:32px;height:32px;"></i>
                    <h6 class="fw-bold mb-1">সদস্যপদ নবায়ন</h6>
                    <small class="text-muted">সদস্যপদ নবায়ন করুন</small>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-3 reveal">
                <a href="#" class="quick-link-card p-3 text-center">
                    <i data-lucide="id-card" class="text-info mb-2" style="width:32px;height:32px;"></i>
                    <h6 class="fw-bold mb-1">সদস্য পরিচয়পত্র</h6>
                    <small class="text-muted">ডিজিটাল সদস্য আইডি</small>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-3 reveal">
                <a href="#" class="quick-link-card p-3 text-center">
                    <i data-lucide="qr-code" class="text-warning mb-2" style="width:32px;height:32px;"></i>
                    <h6 class="fw-bold mb-1">QR যাচাই</h6>
                    <small class="text-muted">সদস্য QR যাচাই করুন</small>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-3 reveal">
                <a href="#" class="quick-link-card p-3 text-center">
                    <i data-lucide="file-badge" class="text-danger mb-2" style="width:32px;height:32px;"></i>
                    <h6 class="fw-bold mb-1">সনদপত্র</h6>
                    <small class="text-muted">সদস্যতা ও প্রশিক্ষণ সনদ</small>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-3 reveal">
                <a href="#" class="quick-link-card p-3 text-center">
                    <i data-lucide="heart-handshake" class="text-success mb-2" style="width:32px;height:32px;"></i>
                    <h6 class="fw-bold mb-1">সদস্য কল্যাণ</h6>
                    <small class="text-muted">আর্থিক সহায়তা ও সুবিধা</small>
                </a>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script><script src="js/main.js"></script>
</body>
</html>
