<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিজিটাল সনদ যাচাই - SKO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header/Navbar -->
    <header class="page-header reveal">
        <div class="container">
            <h1 class="display-6 fw-bold mb-2">ডিজিটাল সনদ যাচাই (Certificate Verification)</h1>
            <p class="lead mb-0">SKO কর্তৃক প্রদত্ত সকল সনদ ও প্রশংসাপত্রের সত্যতা অনলাইনে যাচাই করুন</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="row g-4">
            <div class="col-lg-6 reveal">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">সনদ যাচাই করুন</h5>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">সনদ নম্বর <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="উদাহরণ: SKO-CERT-2026-000123">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">সনদধারীর নাম <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="সনদে উল্লেখিত নাম লিখুন">
                        </div>
                        <button class="btn btn-sko-green w-100"><i data-lucide="search" class="me-1" style="width:16px;"></i> সনদ যাচাই করুন</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 reveal">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4 text-center d-flex flex-column justify-content-center">
                        <i data-lucide="badge-check" class="text-success mb-3 mx-auto" style="width: 60px; height: 60px;"></i>
                        <h4 class="fw-bold">সনদ যাচাইয়ের ফলাফল</h4>
                        <p class="text-muted">সনদ নম্বর ও নাম প্রদান করে যাচাই করুন। সঠিক তথ্য প্রদান করা হলে এখানে সনদের বিস্তারিত তথ্য দেখা যাবে।</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script><script src="js/main.js"></script>
</body>
</html>
